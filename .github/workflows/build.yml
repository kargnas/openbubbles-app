on: [ push, pull_request ]
name: Build
jobs:
  build:
    name: OpenBubbles APK
    runs-on: ubuntu-latest
    env:
      # Empty for PRs from forks; the decode step is then skipped and gradle uses the debug key.
      ALPHA_KEYSTORE_BASE64: ${{ secrets.ALPHA_KEYSTORE_BASE64 }}
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.24.0

      - name: Set up Java
        uses: actions/setup-java@v2
        with:
          java-version: '21'
          distribution: 'temurin'
      
      - name: Setup Android SDK
        uses: amyu/setup-android@v5

      - name: Install Protobuf compiler
        run: sudo apt-get install -y protobuf-compiler

      - name: Set up fake Fairplay keys
        run: |
          mkdir -p rustpush/certs/fairplay

          cert_names=(
            "4056631661436364584235346952193"
            "4056631661436364584235346952194"
            "4056631661436364584235346952195"
            "4056631661436364584235346952196"
            "4056631661436364584235346952197"
            "4056631661436364584235346952198"
            "4056631661436364584235346952199"
            "4056631661436364584235346952200"
            "4056631661436364584235346952201"
            "4056631661436364584235346952208"
          )

          for name in "${cert_names[@]}"; do
              cp rustpush/certs/legacy-fairplay/fairplay.pem rustpush/certs/fairplay/$name.pem
              cp rustpush/certs/legacy-fairplay/fairplay.crt rustpush/certs/fairplay/$name.crt
          done

      - name: Decode Alpha signing key
        if: env.ALPHA_KEYSTORE_BASE64 != ''
        run: |
          echo "$ALPHA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/openbubbles-alpha.jks"
          echo "ALPHA_KEYSTORE_FILE=$RUNNER_TEMP/openbubbles-alpha.jks" >> "$GITHUB_ENV"

      # First run is expected to fail until ffmpeg_kit_flutter_new is fixed.
      - name: Run Build Script
        env:
          ALPHA_KEYSTORE_PASSWORD: ${{ secrets.ALPHA_KEYSTORE_PASSWORD }}
          ALPHA_KEY_ALIAS: ${{ secrets.ALPHA_KEY_ALIAS }}
          ALPHA_KEY_PASSWORD: ${{ secrets.ALPHA_KEY_PASSWORD }}
        run: |
          flutter build apk --flavor alpha --debug --target-platform android-arm64

      - name: Print APK signer certificate
        run: keytool -printcert -jarfile build/app/outputs/flutter-apk/app-alpha-debug.apk | grep -i sha256
      
      - uses: actions/upload-artifact@v4
        with:
          name: Alpha Debug APK
          path: build/app/outputs/flutter-apk/app-alpha-debug.apk