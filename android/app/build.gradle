plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// Fixed signing key for the alpha flavor, so alpha builds update over each other.
// Source priority: ALPHA_* env vars, then ALPHA_KEY_PROPERTIES / ~/keys/openbubbles-alpha/key.properties.
// Falls back to the default signing behaviour when not fully available.
def alphaSigning = null
def alphaSigningSource = null
def alphaEnv = [System.getenv('ALPHA_KEYSTORE_FILE'), System.getenv('ALPHA_KEYSTORE_PASSWORD'),
                System.getenv('ALPHA_KEY_ALIAS'), System.getenv('ALPHA_KEY_PASSWORD')]
if (alphaEnv.every { it }) {
    alphaSigning = [storeFile: new File(alphaEnv[0]), storePassword: alphaEnv[1], keyAlias: alphaEnv[2], keyPassword: alphaEnv[3]]
    alphaSigningSource = 'environment variables'
} else {
    def alphaPropsFile = new File(System.getenv('ALPHA_KEY_PROPERTIES') ?: "${System.getProperty('user.home')}/keys/openbubbles-alpha/key.properties")
    if (alphaPropsFile.isFile()) {
        def p = new Properties()
        alphaPropsFile.withInputStream { p.load(it) }
        if (['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].every { p.getProperty(it) }) {
            def f = new File(p.getProperty('storeFile'))
            if (!f.isAbsolute()) f = new File(alphaPropsFile.parentFile, p.getProperty('storeFile'))
            alphaSigning = [storeFile: f, storePassword: p.getProperty('storePassword'), keyAlias: p.getProperty('keyAlias'), keyPassword: p.getProperty('keyPassword')]
            alphaSigningSource = alphaPropsFile.path
        }
    }
}
if (alphaSigning != null && !alphaSigning.storeFile.isFile()) {
    logger.lifecycle("Alpha signing: keystore ${alphaSigning.storeFile} from ${alphaSigningSource} not found")
    alphaSigning = null
}
logger.lifecycle(alphaSigning != null
        ? "Alpha signing: using fixed key from ${alphaSigningSource}"
        : "Alpha signing: no fixed key found, falling back to default signing (debug key for debug builds)")

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    namespace "com.bluebubbles.messaging"
    compileSdk 36

    lintOptions {
        checkReleaseBuilds false
        disable 'InvalidPackage'
    }

    aaptOptions {
        noCompress "tflite"
    }

    defaultConfig {
        applicationId "com.bluebubbles.messaging"
        minSdkVersion 24
        targetSdkVersion 36
        versionCode 20002000 + flutterVersionCode.toInteger()
        versionName flutterVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
        debug {

        }
        if (alphaSigning != null) {
            alpha {
                storeFile alphaSigning.storeFile
                storePassword alphaSigning.storePassword
                keyAlias alphaSigning.keyAlias
                keyPassword alphaSigning.keyPassword
            }
        }
    }

    flavorDimensions = ["app"]

    productFlavors {
        joel {
            dimension "app"
            resValue "string", "app_name_en", "BlueBubbles Dev (Joel)"
            resValue "color", "ic_launcher_background", "#4c49de"
            resValue "string", "file_provider", "com.bluebubbles.messaging.joel.fileprovider"
            applicationId "com.bluebubbles.messaging.joel"
        }
        tanay {
            dimension "app"
            resValue "string", "app_name_en", "BlueBubbles (Tanay Special Sauce)"
            resValue "color", "ic_launcher_background", "#4c49de"
            resValue "string", "file_provider", "com.bluebubbles.messaging.tanay.fileprovider"
            applicationId "com.bluebubbles.messaging.tanay"
        }
        alpha {
            dimension "app"
            resValue "string", "app_name_en", "OpenBubbles (Alpha)"
            resValue "color", "ic_launcher_background", "#49dbde"
            resValue "string", "file_provider", "com.bluebubbles.messaging.alpha.fileprovider"
            applicationId "com.bluebubbles.messaging.alpha"
        }
        beta {
            dimension "app"
            resValue "string", "app_name_en", "OpenBubbles (Beta)"
            resValue "color", "ic_launcher_background", "#4990de"
            resValue "string", "file_provider", "com.bluebubbles.messaging.beta.fileprovider"
            applicationId "com.bluebubbles.messaging.beta"
        }
        prod {
            getIsDefault().set(true)
            dimension "app"
            resValue "string", "app_name_en", "OpenBubbles"
            resValue "color", "ic_launcher_background", "#4990de"
            resValue "string", "file_provider", "com.openbubbles.messaging.fileprovider"
            applicationId "com.openbubbles.messaging"
        }
    }

    buildFeatures {
        aidl true
        viewBinding true
    }

    buildTypes {
        release {
            productFlavors.joel.signingConfig signingConfigs.debug
            productFlavors.tanay.signingConfig signingConfigs.debug
            productFlavors.alpha.signingConfig signingConfigs.debug
            productFlavors.beta.signingConfig signingConfigs.release
            productFlavors.prod.signingConfig signingConfigs.release
            productFlavors.alpha.signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
    }
    sourceSets {
        main {
            java {
                srcDirs 'src/main/java', 'src/main/java/workers'
            }
        }
    }
}

flutter {
    source '../..'
}

// buildType signingConfig (debug) wins over flavor signingConfig, so override per variant.
if (alphaSigning != null) {
    androidComponents {
        onVariants(selector().withFlavor(new kotlin.Pair("app", "alpha"))) { variant ->
            variant.signingConfig?.setConfig(android.signingConfigs.alpha)
        }
    }
}

// For Cloud Firestore okio error
configurations.all {
    resolutionStrategy {
        force 'com.squareup.okhttp:okhttp:2.7.5'
        force 'com.squareup.okio:okio:1.17.5'
    }
}

dependencies {
    // Android native functions
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.sharetarget:sharetarget:1.2.0"
    implementation 'androidx.browser:browser:1.8.0'
    implementation 'androidx.activity:activity-ktx:1.9.1'
    implementation "androidx.work:work-runtime:2.9.0"
    implementation "androidx.concurrent:concurrent-futures-ktx:1.2.0"

    // Firebase items
    implementation 'com.google.firebase:firebase-messaging:24.0.0'
    implementation 'com.google.firebase:firebase-database:21.0.0'
    implementation 'com.google.firebase:firebase-messaging-directboot:24.0.0'
    implementation 'com.google.firebase:firebase-iid:21.1.0'
    implementation 'com.google.firebase:firebase-firestore:25.0.0'

    // Kotlin Coroutines (async)
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.1"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.8.1"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-guava:1.8.1"

    // Socket IO
    implementation ('io.socket:socket.io-client:2.1.1') {
        // excluding org.json which is provided by Android
        exclude group: 'org.json', module: 'json'
    }

    // JSON parsing
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'

    // For AGP 7.4+ desugaring
    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.0.4")

    // Unified Push
    implementation 'org.unifiedpush.android:connector:2.5.0'

    // uniffi JNA dependency
    implementation "net.java.dev.jna:jna:5.12.0@aar"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-guava:1.6.0"

    // heic decoding
    implementation 'com.github.awxkee:avif-coder:1.8.0'

    def shizuku_version = "13.1.5"
    implementation "dev.rikka.shizuku:api:$shizuku_version"

    // Add this line if you want to support Shizuku
    implementation "dev.rikka.shizuku:provider:$shizuku_version"

    // support credential provider
    implementation "androidx.credentials:credentials:1.6.0-rc01"
    implementation "androidx.biometric:biometric:1.1.0"

    // CBOR encoding (WebAuthn)
    implementation "com.upokecenter:cbor:4.5.2"

    implementation "androidx.autofill:autofill:1.3.0"
}
